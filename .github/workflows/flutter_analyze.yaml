name: flutter_analyze

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  lint:
    strategy:
      # 片方が落ちても、もう片方の結果を最後まで確認できるようにする
      fail-fast: false
      matrix:
        package: [feature_first, layer_first]
        os: [ubuntu-latest]
        flutter-channel: [stable]

    name: flutter_analyze (${{ matrix.package }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: set up repository
        uses: actions/checkout@v4
      - name: set up flutter
        uses: subosito/flutter-action@v2
        with:
          # Flutter のバージョンは各パッケージの .fvmrc を参照する（CI 側と二重管理しない）
          flutter-version-file: ${{ matrix.package }}/.fvmrc
          channel: ${{ matrix.flutter-channel }}
          cache: true
      - name: flutter doctor
        working-directory: ${{ matrix.package }}
        run: flutter doctor -v
      - name: flutter pub get
        working-directory: ${{ matrix.package }}
        run: flutter pub get
      - name: flutter analyze
        working-directory: ${{ matrix.package }}
        run: flutter analyze
      - name: flutter test
        working-directory: ${{ matrix.package }}
        run: flutter test
